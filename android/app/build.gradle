plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.wayli.com"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.wayli.com"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                def storeFileProp = keystoreProperties['storeFile']
                def storePasswordProp = keystoreProperties['storePassword']
                def keyAliasProp = keystoreProperties['keyAlias']
                def keyPasswordProp = keystoreProperties['keyPassword']
                if (storeFileProp && storePasswordProp && keyAliasProp && keyPasswordProp) {
                    storeFile file(storeFileProp)
                    storePassword storePasswordProp
                    keyAlias keyAliasProp
                    keyPassword keyPasswordProp
                } else {
                    logger.warn("key.properties is missing one or more required fields: storeFile, storePassword, keyAlias, keyPassword")
                }
            } else {
                logger.warn("key.properties not found at android/key.properties. Please add it to sign the release.")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
